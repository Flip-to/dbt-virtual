[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-virtual"
version = "0.1.0"
description = "SQLMesh-style virtual data environments for dbt: content-addressed physical tables, zero-copy CLONE incremental seeding, per-environment routine virtualization, and instant view-swap promotion & rollback."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Flip.to Engineering" }
]
keywords = ["dbt", "bigquery", "sqlmesh", "virtual-environments", "blue-green", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyyaml>=6.0.0",
  "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
  "dbt-core>=1.8.0",
  "dbt-duckdb>=1.8.0",
  "duckdb>=1.0.0",
  "hypothesis>=6.100.0",
  "jinja2>=3.1.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
docs = [
  "mkdocs-material>=9.5.0",
]
emulator = [
  "duckdb>=1.0.0",
  "google-cloud-bigquery>=3.20.0",
  "psycopg[binary]>=3.1.0",
  "requests>=2.31.0",
]

[project.scripts]
dbt-virtual = "dbt_virtual.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_virtual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
