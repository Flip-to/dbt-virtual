name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A commit that only touches beans, docs or Markdown (for example flipping a bean to completed before
  # merge) skips the heavy jobs; the docs layout guard and ruff still run.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            # Files changed by the whole PR, against its merge base.
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
          elif [ "$EVENT" = push ] && [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$'                && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE_SHA" HEAD || true)
          else
            files=""   # workflow_dispatch and unknown cases: run everything
          fi
          if [ -n "$files" ]; then
            echo "$files"
            if ! echo "$files" | grep -vE '^(\.beans/|docs/)|\.md$' | grep -q .; then
              code=false
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "code changes: ${code}"

  unit-and-guards:
    needs: changes
    name: Unit tests & docs layout guard
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the upgrade tests read the v0.1.0 tag
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: unit-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Guard docs layout (specs, decisions, tech_debt, beans, A2V)
        run: uv run --python ${{ matrix.python-version }} python scripts/check_docs_layout.py
      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts
      - name: Run unit tests
        if: needs.changes.outputs.code == 'true'
        run: uv run --python ${{ matrix.python-version }} pytest -v -n auto --dist loadfile --durations=15

  dbt-parse-warehouses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: dbt parse with the package on BigQuery & Snowflake (fake credentials)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: parse-3.11
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev --python 3.11
      - name: dbt parse on BigQuery and Snowflake profiles (no connection needed)
        # Skips silently if an adapter cannot be installed, so fail the job on skips.
        run: uv run --python 3.11 pytest -v -rs tests/test_dbt_parse_warehouses.py
        env:
          DBT_VIRTUAL_REQUIRE_PARSE_ADAPTERS: "1"

  # The emulator work runs as parallel jobs, each with its own emulator container (a prebuilt image
  # pinned to the head commit of flipto/main; see .github/actions/start-bq-emulator).
  emulator-lifecycle:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: BigQuery Emulator E2E lifecycle script (Flip-to/bigquery-emulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the upgrade tests read the v0.1.0 tag
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: emulator-3.11
          python-version: "3.11"
      - name: Sync dependencies (with emulator client)
        run: uv sync --extra dev --extra emulator --python 3.11
      - uses: ./.github/actions/start-bq-emulator
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run E2E virtual environment lifecycle test
        env:
          BIGQUERY_EMULATOR_HOST: "http://127.0.0.1:9050"
          BIGQUERY_EMULATOR_PROJECT: "test-project"
        run: uv run --python 3.11 python scripts/run_emulator_e2e.py

  emulator-concurrency-upgrade:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: BigQuery Emulator concurrency and v0.1.0 upgrade checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the upgrade tests read the v0.1.0 tag
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: emulator-3.11
          python-version: "3.11"
      - name: Sync dependencies (with emulator client)
        run: uv sync --extra dev --extra emulator --python 3.11
      - uses: ./.github/actions/start-bq-emulator
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run concurrency and v0.1.0 upgrade checks
        env:
          BIGQUERY_EMULATOR_HOST: "http://127.0.0.1:9050"
          BIGQUERY_EMULATOR_PROJECT: "test-project"
        run: uv run --python 3.11 python scripts/run_emulator_concurrency_upgrade_e2e.py

  emulator-real-dbt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Real dbt-bigquery E2E on the emulator (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every test of the file runs in exactly one shard: `rest` is the complement of the named ones.
        include:
          - shard: full-lifecycle
            select: "test_full_lifecycle_on_real_dbt_bigquery"
          - shard: multi-dataset
            select: "test_multi_dataset_environments_refresh_and_demotion_on_bigquery"
          - shard: rest
            select: "not test_full_lifecycle_on_real_dbt_bigquery and not test_multi_dataset_environments_refresh_and_demotion_on_bigquery"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the upgrade tests read the v0.1.0 tag
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: emulator-3.11
          python-version: "3.11"
      - name: Sync dependencies (with emulator client)
        run: uv sync --extra dev --extra emulator --python 3.11
      - uses: ./.github/actions/start-bq-emulator
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Real dbt-core + dbt-bigquery E2E (dbt-virtual lifecycle on the emulator)
        env:
          DBT_VIRTUAL_BQ_EMULATOR: "http://127.0.0.1:9050"
          DBT_VIRTUAL_BQ_EMULATOR_PROJECT: "test-project"
          # A missing adapter or emulator fails the job instead of skipping the tests.
          DBT_VIRTUAL_REQUIRE_BQ_EMULATOR: "1"
        run: >-
          uv run --python 3.11 pytest -v -rs -n 4 --dist load
          -k "${{ matrix.select }}" tests/test_dbt_bigquery_emulator_e2e.py

  snowflake-and-postgres-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Snowflake Emulator (nnnkkk7/snowflake-emulator) & Postgres E2E
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbt
          POSTGRES_PASSWORD: dbt
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbt -d test_db"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: sf-pg-emulator-3.11
          python-version: "3.11"
      - name: Sync dependencies (with emulator & postgres clients)
        run: uv sync --extra dev --extra emulator --python 3.11
      - name: Resolve nnnkkk7/snowflake-emulator revision
        id: sfemu_rev
        run: |
          REV=$(git ls-remote https://github.com/nnnkkk7/snowflake-emulator.git HEAD | cut -f1)
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"
      - name: Cache nnnkkk7/snowflake-emulator Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/sfemu-cache
          key: sfemu-image-v1-${{ steps.sfemu_rev.outputs.rev }}
          restore-keys: |
            sfemu-image-v1-
      - name: Start nnnkkk7/snowflake-emulator
        run: |
          set -euo pipefail
          mkdir -p /tmp/sfemu-cache
          if [ -f /tmp/sfemu-cache/sfemu.tar.zst ]; then
            echo "Loading cached nnnkkk7/snowflake-emulator image..."
            zstd -dc /tmp/sfemu-cache/sfemu.tar.zst | docker load
            SF_IMAGE="snowflake-emulator:cached"
          else
            docker pull ghcr.io/nnnkkk7/snowflake-emulator:latest
            docker tag ghcr.io/nnnkkk7/snowflake-emulator:latest snowflake-emulator:cached
            docker save snowflake-emulator:cached | zstd -T0 -3 -o /tmp/sfemu-cache/sfemu.tar.zst
            SF_IMAGE="snowflake-emulator:cached"
          fi
          docker run -d --name sfemu -p 8080:8080 "$SF_IMAGE"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "Snowflake emulator is ready."
              break
            fi
            sleep 1
          done
      - name: Run Snowflake Emulator & PostgreSQL E2E lifecycle tests
        env:
          SNOWFLAKE_EMULATOR_HOST: "http://127.0.0.1:8080"
          POSTGRES_DSN: "postgresql://dbt:dbt@127.0.0.1:5432/test_db"
        run: uv run --python 3.11 python scripts/run_snowflake_emulator_e2e.py

  # One check to require: green when every job passed or was skipped for a docs-only change.
  ci-ok:
    name: CI ok
    if: always()
    needs:
      - changes
      - unit-and-guards
      - dbt-parse-warehouses
      - emulator-lifecycle
      - emulator-concurrency-upgrade
      - emulator-real-dbt
      - snowflake-and-postgres-e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then exit 1; fi
