name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-guards:
    name: Unit tests & docs layout guard
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: unit-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Guard docs layout (specs, decisions, tech_debt, beans, A2V)
        run: uv run --python ${{ matrix.python-version }} python scripts/check_docs_layout.py
      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts
      - name: Run unit tests
        run: uv run --python ${{ matrix.python-version }} pytest -v -n auto --dist loadfile --durations=15

  dbt-parse-warehouses:
    name: dbt parse with the package on BigQuery & Snowflake (fake credentials)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: parse-3.11
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev --python 3.11
      - name: dbt parse on BigQuery and Snowflake profiles (no connection needed)
        # Skips silently if an adapter cannot be installed, so fail the job on skips.
        run: uv run --python 3.11 pytest -v -rs tests/test_dbt_parse_warehouses.py
        env:
          DBT_VIRTUAL_REQUIRE_PARSE_ADAPTERS: "1"

  emulator-e2e:
    name: BigQuery Emulator E2E (Flip-to/bigquery-emulator)
    runs-on: ubuntu-24.04
    env:
      # The emulator branch the image is built from.
      BQEMU_BRANCH: claude/dbt-bigquery-support-proof
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: emulator-3.11
          python-version: "3.11"
      - name: Sync dependencies (with emulator client)
        run: uv sync --extra dev --extra emulator --python 3.11
      - name: Resolve Flip-to/bigquery-emulator revision
        id: bqemu_rev
        run: |
          REV=$(git ls-remote https://github.com/Flip-to/bigquery-emulator.git refs/heads/${BQEMU_BRANCH} | cut -f1)
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"
      - name: Cache Flip-to/bigquery-emulator Docker image
        id: bqemu_cache
        uses: actions/cache@v5
        with:
          path: /tmp/bqemu-cache
          # Exact revision only: an older image lacks emulator fixes the E2E relies on.
          key: bqemu-image-v2-${{ steps.bqemu_rev.outputs.rev }}
      - name: Start Flip-to/bigquery-emulator
        run: |
          set -euo pipefail
          mkdir -p /tmp/bqemu-cache
          if [ -f /tmp/bqemu-cache/bqemu.tar.zst ]; then
            echo "Loading cached Flip-to/bigquery-emulator image..."
            zstd -dc /tmp/bqemu-cache/bqemu.tar.zst | docker load
            IMAGE="bigquery-emulator:flipto"
          else
            # Build the resolved revision (the ghcr `flipto` tag can lag behind flipto/main).
            echo "Building Flip-to/bigquery-emulator at ${{ steps.bqemu_rev.outputs.rev }}..."
            docker build -t bigquery-emulator:flipto "https://github.com/Flip-to/bigquery-emulator.git#${{ steps.bqemu_rev.outputs.rev }}"
            IMAGE="bigquery-emulator:flipto"
            docker save bigquery-emulator:flipto | zstd -T0 -3 -o /tmp/bqemu-cache/bqemu.tar.zst
          fi
          docker run -d --name bqemu -p 9050:9050 -p 9060:9060 "$IMAGE" \
            --project=test-project --host=0.0.0.0 --port=9050
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9050/bigquery/v2/projects/test-project/datasets >/dev/null; then
              echo "BigQuery emulator is ready."
              break
            fi
            sleep 1
          done
      - name: Run E2E virtual environment lifecycle test
        env:
          BIGQUERY_EMULATOR_HOST: "http://127.0.0.1:9050"
          BIGQUERY_EMULATOR_PROJECT: "test-project"
        run: uv run --python 3.11 python scripts/run_emulator_e2e.py
      - name: Probe the emulator for what real dbt-bigquery needs
        id: dbt_bq_probe
        env:
          BIGQUERY_EMULATOR_HOST: "http://127.0.0.1:9050"
          BIGQUERY_EMULATOR_PROJECT: "test-project"
        run: uv run --python 3.11 python scripts/probe_bq_emulator_dbt_support.py
      - name: "GATED: real dbt-bigquery E2E skipped, the emulator is missing fixes"
        if: steps.dbt_bq_probe.outputs.supported != 'true'
        # Not silently skipped: a warning annotation names what is missing. Remove this step, the
        # probe step and scripts/probe_bq_emulator_dbt_support.py when the emulator PRs listed in
        # .beans/dbt-virtual-0031--real-dbt-bigquery-on-emulator.md are merged.
        run: |
          echo "::warning title=Real dbt-bigquery E2E skipped::flipto/main lacks: ${{ steps.dbt_bq_probe.outputs.missing }}. See .beans/dbt-virtual-0031--real-dbt-bigquery-on-emulator.md"
      - name: Real dbt-core + dbt-bigquery E2E (dbt-virtual lifecycle on the emulator)
        if: steps.dbt_bq_probe.outputs.supported == 'true'
        env:
          DBT_VIRTUAL_BQ_EMULATOR: "http://127.0.0.1:9050"
          DBT_VIRTUAL_BQ_EMULATOR_PROJECT: "test-project"
          # A missing adapter or emulator fails the job instead of skipping the tests.
          DBT_VIRTUAL_REQUIRE_BQ_EMULATOR: "1"
        run: uv run --python 3.11 pytest -v -rs -n 4 --dist load tests/test_dbt_bigquery_emulator_e2e.py

  snowflake-and-postgres-e2e:
    name: Snowflake Emulator (nnnkkk7/snowflake-emulator) & Postgres E2E
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbt
          POSTGRES_PASSWORD: dbt
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbt -d test_db"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: sf-pg-emulator-3.11
          python-version: "3.11"
      - name: Sync dependencies (with emulator & postgres clients)
        run: uv sync --extra dev --extra emulator --python 3.11
      - name: Resolve nnnkkk7/snowflake-emulator revision
        id: sfemu_rev
        run: |
          REV=$(git ls-remote https://github.com/nnnkkk7/snowflake-emulator.git HEAD | cut -f1)
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"
      - name: Cache nnnkkk7/snowflake-emulator Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/sfemu-cache
          key: sfemu-image-v1-${{ steps.sfemu_rev.outputs.rev }}
          restore-keys: |
            sfemu-image-v1-
      - name: Start nnnkkk7/snowflake-emulator
        run: |
          set -euo pipefail
          mkdir -p /tmp/sfemu-cache
          if [ -f /tmp/sfemu-cache/sfemu.tar.zst ]; then
            echo "Loading cached nnnkkk7/snowflake-emulator image..."
            zstd -dc /tmp/sfemu-cache/sfemu.tar.zst | docker load
            SF_IMAGE="snowflake-emulator:cached"
          else
            docker pull ghcr.io/nnnkkk7/snowflake-emulator:latest
            docker tag ghcr.io/nnnkkk7/snowflake-emulator:latest snowflake-emulator:cached
            docker save snowflake-emulator:cached | zstd -T0 -3 -o /tmp/sfemu-cache/sfemu.tar.zst
            SF_IMAGE="snowflake-emulator:cached"
          fi
          docker run -d --name sfemu -p 8080:8080 "$SF_IMAGE"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "Snowflake emulator is ready."
              break
            fi
            sleep 1
          done
      - name: Run Snowflake Emulator & PostgreSQL E2E lifecycle tests
        env:
          SNOWFLAKE_EMULATOR_HOST: "http://127.0.0.1:8080"
          POSTGRES_DSN: "postgresql://dbt:dbt@127.0.0.1:5432/test_db"
        run: uv run --python 3.11 python scripts/run_snowflake_emulator_e2e.py
