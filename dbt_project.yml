name: 'dbt_virtual'
version: '0.1.0'
config-version: 2

require-dbt-version: [">=1.6.0", "<2.0.0"]

macro-paths: ["macros"]
model-paths: ["models"]

clean-targets:
  - "target"
  - "dbt_packages"
  - ".dbt_virtual"
  - "tests"

vars:
  dbt_virtual:
    enabled: true
    physical_schema: "dbt_virtual_physical"
    environment: "staging"
    base_environment: "prod"
    ref_resolution: "env_view"
    env_schemas:
      staging: "staging"
      prod: "prod"
    retention_releases: 5
    retention_days: 7
    authorize_env_views: false  # BigQuery: authorize each env dataset (views) on the physical dataset
    expire_env_days: null       # gc drops unmapped envs idle for N days (null = off)
